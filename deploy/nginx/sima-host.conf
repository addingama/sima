# Nginx di host VPS (staging). TLS berhenti di sini.
# Placeholder __SIMA_DOMAIN__ dan __SIMA_STORAGE__ diganti saat deploy.

server {
    listen 80;
    listen [::]:80;
    server_name __SIMA_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SIMA_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__SIMA_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SIMA_DOMAIN__/privkey.pem;

    client_max_body_size 25M;

    location /api {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location /storage/ {
        alias __SIMA_STORAGE__/app/public/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:__SIMA_FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
