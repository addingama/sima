# Override staging: nginx dan MySQL berjalan di host VPS, bukan di container.
# Pakai bersama file production:
#   COMPOSE_FILES="docker-compose.prod.yml docker-compose.staging.yml"
#   SIMA_NGINX=host
#   SIMA_MYSQL=host
#   DB_HOST=host.docker.internal
#
# PHP-FPM dan Next.js hanya membuka port di localhost supaya nginx host yang
# menerima trafik publik. Storage mengikuti SIMA_HOST_STORAGE di file production.
# depends_on mysql pada file production memakai required: false, jadi Compose
# sebelum v2.24 tetap bisa membangun image tanpa service mysql.

services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9000:9000"
    depends_on: !override
      redis:
        condition: service_healthy

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    ports:
      - "127.0.0.1:${SIMA_FRONTEND_PORT:-3010}:3000"
