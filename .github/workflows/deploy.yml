name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: ahp-staging
        type: choice
        options:
          - ahp-staging
          - ahp-production
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

concurrency:
  group: deploy-${{ inputs.environment || 'ahp-staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on VPS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'ahp-production' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REPO: ${{ secrets.DEPLOY_REPO || format('{0}/{1}.git', github.server_url, github.repository) }}

    steps:
      - name: Deploy via SSH
        if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' && env.DEPLOY_PATH != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            export DEPLOY_REPO="${{ env.DEPLOY_REPO }}"
            export DEPLOY_BRANCH="${{ inputs.branch || 'main' }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone --branch "$DEPLOY_BRANCH" "$DEPLOY_REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            sh scripts/deploy-vps.sh

      - name: Deploy skipped (secrets not configured)
        if: ${{ env.DEPLOY_HOST == '' || env.DEPLOY_USER == '' || env.DEPLOY_SSH_KEY == '' || env.DEPLOY_PATH == '' }}
        run: |
          echo "::warning::Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and DEPLOY_PATH secrets to enable SSH deploy."
