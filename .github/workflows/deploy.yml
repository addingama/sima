name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: ahp-staging
        type: choice
        options:
          - ahp-staging
          - ahp-production
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'ahp-staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on VPS
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'ahp-staging' }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REPO: ${{ secrets.DEPLOY_REPO || format('{0}/{1}.git', github.server_url, github.repository) }}

    steps:
      - name: Validate deploy secrets
        run: |
          missing=""

          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"

          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Environment secrets for '${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'ahp-staging' }}':$missing"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            export DEPLOY_REPO="${{ env.DEPLOY_REPO }}"
            export DEPLOY_BRANCH="${{ inputs.branch || 'main' }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone --branch "$DEPLOY_BRANCH" "$DEPLOY_REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            sh scripts/deploy-vps.sh
